name: Playwright

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - 'copilot/**'
  workflow_dispatch:

jobs:
  test-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run default Playwright suite
        run: npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-test-stage
          path: playwright-report/
          if-no-files-found: ignore

  uat-stage:
    needs: test-stage
    runs-on: ubuntu-latest
    env:
      UAT_BASE_URL: https://taotlus.bigbank.ee/?amount=6500&period=48&productName=SMALL_LOAN&loanPurpose=DAILY_SETTLEMENTS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UAT Playwright suite
        run: BASE_URL="${UAT_BASE_URL}" npm test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-uat-stage
          path: playwright-report/
          if-no-files-found: ignore
